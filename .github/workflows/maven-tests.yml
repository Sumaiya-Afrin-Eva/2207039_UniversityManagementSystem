name: University Management System CI

run-name: ${{ github.event.head_commit.message || github.event.pull_request.title || 'Manual test run' }}

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: university-management-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (Java 25)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: 'pom.xml'

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      # --- ৬টি ইউনিট টেস্ট (UserServiceTest) আলাদাভাবে রান ---
      - name: Unit Test 1 - Find By Role
        run: ./mvnw --batch-mode --no-transfer-progress test -Dtest=UserServiceTest#findByRoleReturnsResponsesForMatchingRole

      - name: Unit Test 2 - Reject Different Role
        run: ./mvnw --batch-mode --no-transfer-progress test -Dtest=UserServiceTest#findRejectsUserWithDifferentRole

      - name: Unit Test 3 - Create User & Encode Password
        run: ./mvnw --batch-mode --no-transfer-progress test -Dtest=UserServiceTest#createNormalizesFieldsAndEncodesPassword

      - name: Unit Test 4 - Reject Student Without ID
        run: ./mvnw --batch-mode --no-transfer-progress test -Dtest=UserServiceTest#createRejectsStudentWithoutStudentId

      - name: Unit Test 5 - Update Profile Keep Password
        run: ./mvnw --batch-mode --no-transfer-progress test -Dtest=UserServiceTest#updateChangesProfileAndKeepsPasswordWhenNoNewPasswordIsProvided

      - name: Unit Test 6 - Delete User
        run: ./mvnw --batch-mode --no-transfer-progress test -Dtest=UserServiceTest#deleteRemovesUserOfRequestedRole

      # --- ৩টি ইন্টিগ্রেশন টেস্ট (UserManagementL1Test) আলাদাভাবে রান ---
      # --- ৩টি ইন্টিগ্রেশন টেস্ট (UserManagementL1Test) আলাদাভাবে রান ---
      - name: Integration Test 1 - Admin Creates Student
        run: ./mvnw --batch-mode --no-transfer-progress test -Dtest=UserManagementL1Test#adminCreatesStudentAndPersistsEncodedCredentials

      - name: Integration Test 2 - Student Reads Students
        run: ./mvnw --batch-mode --no-transfer-progress test -Dtest=UserManagementL1Test#studentCanReadStudentsFromTheDatabase

      - name: Integration Test 3 - Reject Duplicate Email
        run: ./mvnw --batch-mode --no-transfer-progress test -Dtest=UserManagementL1Test#duplicateEmailIsRejectedWithoutPersistingTheNewUser
      
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: "target/surefire-reports/"
          if-no-files-found: ignore
