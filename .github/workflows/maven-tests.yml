name: University Management System CI/CD

run-name: ${{ github.event.head_commit.message || 'Manual test run' }}

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (Java 25)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: 'pom.xml'

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Run all tests
        run: ./mvnw --batch-mode --no-transfer-progress test
