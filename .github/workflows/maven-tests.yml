name: University Management System CI

run-name: ${{ github.event.head_commit.message || 'Individual 9 Tests Run' }}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  run-9-tests:
    name: ${{ matrix.test_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_name: "Unit 1: Find By Role"
            test_method: "UserServiceTest#findByRoleReturnsResponsesForMatchingRole"
          - test_name: "Unit 2: Reject Different Role"
            test_method: "UserServiceTest#findRejectsUserWithDifferentRole"
          - test_name: "Unit 3: Create & Encode Password"
            test_method: "UserServiceTest#createNormalizesFieldsAndEncodesPassword"
          - test_name: "Unit 4: Reject Student Without ID"
            test_method: "UserServiceTest#createRejectsStudentWithoutStudentId"
          - test_name: "Unit 5: Update Profile Keep Password"
            test_method: "UserServiceTest#updateChangesProfileAndKeepsPasswordWhenNoNewPasswordIsProvided"
          - test_name: "Unit 6: Delete User"
            test_method: "UserServiceTest#deleteRemovesUserOfRequestedRole"
          - test_name: "Integration 1: Admin Creates Student"
            test_method: "UserManagementL1Test#adminCreatesStudentAndPersistsEncodedCredentials"
          - test_name: "Integration 2: Student Reads Students"
            test_method: "UserManagementL1Test#studentCanReadStudentsFromTheDatabase"
          - test_name: "Integration 3: Reject Duplicate Email"
            test_method: "UserManagementL1Test#duplicateEmailIsRejectedWithoutPersistingTheNewUser"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: 'pom.xml'

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Run ${{ matrix.test_name }}
        run: ./mvnw --batch-mode --no-transfer-progress test -Dtest=${{ matrix.test_method }}
