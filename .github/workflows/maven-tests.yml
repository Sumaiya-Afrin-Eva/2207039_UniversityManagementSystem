
name: University Management System CI/CD

run-name: ${{ github.event.head_commit.message || 'Manual test run' }}

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (Java 25)
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: university_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d university_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/university_test
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: 'pom.xml'

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Run all tests
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Run Unit Tests
        run: ./mvnw --batch-mode --no-transfer-progress test -Dtest=UserServiceTest

      - name: Run Integration Tests
        run: ./mvnw --batch-mode --no-transfer-progress test -Dtest=UserManagementL1Test
